### Java sdk configuration
network.peers[0]=${FISCO_PEERS:127.0.0.1:20200}
### Optional. Default will search conf,config,src/main/conf/src/main/config
cryptoMaterial.certPath=${FISCO_SDK_CERT_PATH:conf}

### System configuration
system.groupId=${FISCO_GROUP_ID:group0}
system.hexPrivateKey=${SYSTEM_HEX_PRIVATE_KEY:}

### Contract configuration
contract.agriTraceAddress=${FISCO_CONTRACT_ADDRESS:0x0102e8b6fc8cdf9626fddc1c3ea8c1e79b3fce94}

### Springboot configuration
server.port=8080
server.session.timeout=60
banner.charset=UTF-8
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=GMT+8
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
